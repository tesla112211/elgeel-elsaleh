/* =====================================================================
   سلة المشتريات
   ---------------------------------------------------------------------
   - تُحفظ في localStorage على هذا الجهاز وهذا المتصفح فقط.
   - لا تمثل نظامًا مركزيًا للطلبات؛ الطلب يصل فقط عند إرساله عبر واتساب.
   - تُخزَّن المعرّفات والكميات فقط. الأسعار والأسماء تُقرأ دائمًا من الكتالوج.
   ===================================================================== */

const KEY = 'ajs-cart-v1';
const EVENT = 'ajs:cart-change';
const MAX = SITE.maxQty;

let memory = [];
let persistent = (() => {
  try {
    const k = '__ajs_test__';
    localStorage.setItem(k, k);
    localStorage.removeItem(k);
    return true;
  } catch {
    return false;
  }
})();

const isPersistent = () => persistent;

const toQty = (v) => {
  const n = Math.floor(Number(v));
  return Number.isFinite(n) ? n : 0;
};

function sanitize(list) {
  const merged = new Map();
  (Array.isArray(list) ? list : []).forEach((item) => {
    const id = typeof item?.id === 'string' ? item.id : '';
    const qty = toQty(item?.qty);
    if (!id || qty < 1) return;
    merged.set(id, Math.min(MAX, (merged.get(id) || 0) + qty));
  });
  return [...merged].map(([id, qty]) => ({ id, qty }));
}

function read() {
  if (!persistent) return sanitize(memory);
  try {
    return sanitize(JSON.parse(localStorage.getItem(KEY) || '[]'));
  } catch {
    return [];
  }
}

function write(list) {
  const clean = sanitize(list);
  if (persistent) {
    try {
      localStorage.setItem(KEY, JSON.stringify(clean));
    } catch {
      persistent = false;
    }
  }
  memory = clean;
  window.dispatchEvent(new CustomEvent(EVENT));
}

const getItems = () => read();
const getCount = () => read().reduce((sum, i) => sum + i.qty, 0);

/** إضافة كتاب — يتحقق من وجوده وتوفره في الكتالوج */
function addItem(catalog, id, qty = 1) {
  const product = catalog.productById.get(id);
  if (!product) return { ok: false, reason: 'missing' };
  if (!product.available) return { ok: false, reason: 'unavailable' };
  const add = toQty(qty);
  if (add < 1) return { ok: false, reason: 'qty' };

  const items = read();
  const existing = items.find((i) => i.id === id);
  const current = existing ? existing.qty : 0;
  const next = Math.min(MAX, current + add);
  if (existing) existing.qty = next;
  else items.push({ id, qty: next });
  write(items);
  return { ok: true, qty: next, capped: current + add > MAX, product };
}

function setQty(id, qty) {
  const n = Math.min(MAX, Math.max(1, toQty(qty) || 1));
  write(read().map((i) => (i.id === id ? { ...i, qty: n } : i)));
  return n;
}

const removeItem = (id) => write(read().filter((i) => i.id !== id));
const clearCart = () => write([]);

/** يحذف من السلة أي كتاب لم يعد موجودًا أو متاحًا، ويعيد أسماء ما حُذف */
function reconcile(catalog) {
  const items = read();
  const kept = [];
  const removed = [];
  items.forEach((i) => {
    const p = catalog.productById.get(i.id);
    if (p && p.available) kept.push(i);
    else removed.push(p ? p.name : null);
  });
  if (removed.length) write(kept);
  return removed;
}

/** سطور السلة محسوبة من أسعار الكتالوج فقط */
function getLines(catalog) {
  const lines = read()
    .map((i) => {
      const product = catalog.productById.get(i.id);
      return product ? { product, qty: i.qty, total: product.price * i.qty } : null;
    })
    .filter(Boolean);
  return {
    lines,
    count: lines.reduce((s, l) => s + l.qty, 0),
    total: lines.reduce((s, l) => s + l.total, 0),
  };
}

/** يستدعي الدالة عند أي تغيير في السلة، حتى لو حصل في تبويب آخر */
function onCartChange(callback) {
  window.addEventListener(EVENT, callback);
  window.addEventListener('storage', (e) => {
    if (e.key === KEY || e.key === null) callback();
  });
}

/** يحوّل الرقم إلى الصيغة الدولية المطلوبة لرابط wa.me */
function waNumber() {
  let n = String(SITE.whatsappNumber || '').replace(/\D/g, '');
  if (n.startsWith('00')) n = n.slice(2);
  if (n.length === 11 && n.startsWith('01')) n = `2${n}`; // 01xxxxxxxxx → 201xxxxxxxxx
  return n.length >= 10 ? n : null;
}

const isWhatsAppReady = () => waNumber() !== null;

function waLink(text) {
  const n = waNumber();
  return n ? `https://wa.me/${n}?text=${encodeURIComponent(text)}` : null;
}

/** رقم مرجعي قصير يسهّل متابعة الطلب في المحادثة — ليس رقم تسجيل على خادم */
function orderRef(prefix) {
  const d = new Date();
  const ymd = `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const rand = Math.floor(1000 + Math.random() * 9000);
  return `${prefix}-${ymd}-${rand}`;
}

function buildOrderMessage({ lines, count, total }, customer = {}, ref) {
  const rows = lines.map(
    (l, i) => `${i + 1}) ${l.product.name}\n   الكمية: ${l.qty} × ${formatPrice(l.product.price)} = ${formatPrice(l.total)}`
  );
  const parts = [
    `مرحبًا، أريد طلب الكتب التالية من ${SITE.name}:`,
    '',
    ...rows,
    '',
    `عدد النسخ: ${count}`,
    `إجمالي سعر الكتب: ${formatPrice(total)}`,
  ];
  const extra = [];
  if (customer.name) extra.push(`الاسم: ${customer.name}`);
  if (customer.governorate) extra.push(`المحافظة: ${customer.governorate}`);
  if (customer.notes) extra.push(`ملاحظات: ${customer.notes}`);
  if (extra.length) parts.push('', ...extra);
  parts.push('', `الرقم المرجعي: ${ref}`);
  return parts.join('\n');
}

function buildWholesaleMessage(data, ref) {
  const parts = [

    data.items.forEach((it, i) => {

      parts.push(`${i + 1}) ${it.product.name}${lv} — الكمية: ${it.qty}`);

}

   التتبع (Meta Pixel) — لا يُحمّل أي كود إلا إذا وُضع pixelId في config.js
   الأحداث المرسلة:
   ViewContent (صفحة الكتاب) · AddToCart · InitiateCheckout (إرسال السلة لواتساب)
   Lead (إرسال طلب الحضانات لواتساب) · Contact (رسالة صفحة التواصل)
   ===================================================================== */

let ready = false;

function initAnalytics() {
  const id = String(SITE.pixelId || '').trim();
  if (!id || ready || !/^\d+$/.test(id)) return;
  ready = true;
  /* كود Meta Pixel الرسمي بصيغة مختصرة */
  const f = window;
  if (f.fbq) return;
  const n = (f.fbq = function () {
    n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
  });
  if (!f._fbq) f._fbq = n;
  n.push = n;
  n.loaded = true;
  n.version = '2.0';
  n.queue = [];
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://connect.facebook.net/en_US/fbevents.js';
  document.head.append(s);
  f.fbq('init', id);
  f.fbq('track', 'PageView');
}

function track(event, data = {}) {
  if (!ready || typeof window.fbq !== 'function') return;
  window.fbq('track', event, { currency: 'EGP', ...data });
}

let closeMenu = () => {};
function setupMenu(btn, panel) {
  const close = closeMenu = () => {
    btn.setAttribute('aria-expanded', 'false');
    panel.hidden = true;
  };
  btn.addEventListener('click', () => {
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    panel.hidden = open;
  });
  document.addEventListener('click', (e) => {
    if (!btn.parentElement.contains(e.target)) close();
  });
  btn.parentElement.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !panel.hidden) {
      close();
      btn.focus();
    }
  });
  btn.parentElement.addEventListener('focusout', (e) => {
    if (e.relatedTarget && !btn.parentElement.contains(e.relatedTarget)) close();
  });
}

let closeDrawer = () => {};
function buildDrawer(active, toggle) {
  const catList = el('ul', { class: 'drawer__sub' });
  const closeBtn = el('button', { type: 'button', class: 'icon-btn', 'aria-label': 'إغلاق القائمة' }, icon('x'));
  const links = el('ul', { class: 'drawer__list' }, NAV.map((item) => {
    if (item.menu) {
      return el('li', {}, el('details', { class: 'drawer__group' },
        el('summary', {}, el('span', { text: item.label }), icon('chevron-down', 'icon--sm')), catList));
    }
    return el('li', {}, el('a', { href: pageUrl(item.href), dataset: { key: item.key }, 'aria-current': item.key === active ? 'page' : null, text: item.label }));
  }));

  const panel = el('div', { class: 'drawer__panel', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'القائمة' },
    el('div', { class: 'drawer__head' }, brandEl('brand--sm'), closeBtn),
    el('nav', { 'aria-label': 'قائمة الموبايل' }, links),
    el('a', { class: 'btn btn--primary btn--block drawer__cta', href: pageUrl('wholesale.html') }, icon('school'), 'طلبات الحضانات'));
  const backdrop = el('div', { class: 'drawer__backdrop' });
  const drawer = el('div', { class: 'drawer', id: 'drawer', hidden: true }, backdrop, panel);

  const focusables = () => [...panel.querySelectorAll('a[href], button, summary')].filter((n) => n.offsetParent !== null);
  const open = () => {
    drawer.hidden = false;
    requestAnimationFrame(() => drawer.classList.add('is-open'));
    toggle.setAttribute('aria-expanded', 'true');
    document.documentElement.classList.add('is-locked');
    closeBtn.focus();
  };
  const close = () => {
    if (drawer.hidden) return;
    drawer.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
    document.documentElement.classList.remove('is-locked');
    const done = () => { drawer.hidden = true; };
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) done();
    else panel.addEventListener('transitionend', done, { once: true });
    toggle.focus();
  };
  closeDrawer = () => { if (drawer.hidden) return; drawer.classList.remove('is-open'); toggle.setAttribute('aria-expanded', 'false'); document.documentElement.classList.remove('is-locked'); drawer.hidden = true; };
  toggle.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', close);
  drawer.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') {
      const f = focusables();
      if (!f.length) return;
      const first = f[0];
      const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  matchMedia('(min-width: 1024px)').addEventListener('change', (m) => { if (m.matches && !drawer.hidden) close(); });

  return { drawer, catList };
}

/* ---------- الإضافة للسلة (مشتركة بين الصفحات) ---------- */
function addToCart(catalog, product, qty = 1) {
  const res = addItem(catalog, product.id, qty);
  if (!res.ok) {
    toast(res.reason === 'unavailable' ? 'هذا الكتاب غير متاح حاليًا.' : 'تعذّر إضافة الكتاب.');
    return res;
  }
  const msg = res.capped
    ? `وصلت للحد الأقصى (${formatNumber(MAX_QTY)}) من «${product.name}». للكميات الأكبر استخدم طلب الحضانات.`
    : `أُضيف «${product.name}» إلى السلة.`;
  toast(msg, { link: { href: pageUrl('cart.html'), text: 'عرض السلة' } });
  track('AddToCart', { content_ids: [product.id], content_type: 'product', value: product.price * qty });
  return res;
}

/* ---------- التهيئة ---------- */
function initLayout(active) {
  initAnalytics();
  setCanonical();

  const headerSlot = document.getElementById('site-header');
  const footerSlot = document.getElementById('site-footer');
  const { header, badge, cartLink, toggle } = buildHeader(active);
  const { drawer, catList } = buildDrawer(active, toggle);

  const skip = el('a', { class: 'skip-link', href: '#main', text: 'تخطَّ إلى المحتوى',
    onclick: (e) => { e.preventDefault(); document.getElementById('main').focus(); } });
  headerSlot.replaceChildren(skip, header);
  document.body.append(drawer);

  const updateBadge = () => {
    const n = getCount();
    badge.textContent = n > 99 ? '99+' : formatNumber(n);
    badge.hidden = n === 0;
    cartLink.setAttribute('aria-label', n ? `السلة، فيها ${copiesLabel(n)}` : 'السلة فارغة');
  };
  updateBadge();
  onCartChange(updateBadge);

  const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 4);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const ready = getCatalog();
  ready
    .then((catalog) => {
      fillMenu(document.getElementById('cat-menu'), catalog);
      catList.replaceChildren(...catalog.categories.map((c) =>
        el('li', {}, el('a', { href: pageUrl('books.html', { category: c.id }), text: c.name }))));
      const notice = devNotice(catalog);
      if (notice) headerSlot.prepend(notice);
      footerSlot.replaceChildren(buildFooter(catalog));
    })
    .catch(() => {
      footerSlot.replaceChildren(buildFooter(null));
      const notice = devNotice(null);
      if (notice) headerSlot.prepend(notice);
    });
  return ready;
}

/* ---------- تحديث القائمة عند الانتقال بين الصفحات ---------- */
function onRouteChange(active) {
  closeMenu();
  closeDrawer();
  document.querySelectorAll('[data-key]').forEach((a) => {
    if (a.dataset.key === active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

/* ============================ جميع الكتب ============================ */
PAGES.books = (route) => {
  const grid = $('#books-grid');
  const form = $('#filters');
  const q = $('#q');
  const chips = $('#cat-chips');
  const levelSel = $('#level');
  const ageSel = $('#age');
  const sortSel = $('#sort');
  const count = $('#results-count');
  const clearBtn = $('#clear-filters');
  const title = $('#page-title');
  const text = $('#page-text');
  const crumbs = $('#crumbs');
  const defaultText = text.textContent;
  let catalog = null;
  let index = [];
  const state = { q: '', category: '', level: '', age: '', sort: '' };

  function readParams(p) {
    state.q = p.get('q') || '';
    state.category = catalog.categoryById.has(p.get('category')) ? p.get('category') : '';
    state.level = catalog.levels.some((l) => l.id === p.get('level')) ? p.get('level') : '';
    state.age = catalog.ageGroups.some((a) => a.id === p.get('age')) ? p.get('age') : '';
    const sorts = ['price-asc', 'price-desc', ...(catalog.hasDates ? ['newest'] : [])];
    state.sort = sorts.includes(p.get('sort')) ? p.get('sort') : '';
  }
  /* حالة الفلاتر تُكتب في الرابط بدون إعادة تحميل الصفحة، فيمكن مشاركتها */
  const writeParams = () => history.replaceState(null, '', pageUrl('books.html', state));
  function syncControls() {
    q.value = state.q;
    levelSel.value = state.level;
    ageSel.value = state.age;
    sortSel.value = state.sort;
    $$('.chip', chips).forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.value === state.category)));
  }
  function filtered() {
    const terms = normalizeArabic(state.q).split(' ').filter(Boolean);
    let list = index.filter(({ p, hay }) =>
      (!state.category || p.category === state.category) &&
      (!state.level || p.level.includes(state.level)) &&
      (!state.age || p.ageGroup === state.age) &&
      terms.every((t) => hay.includes(t))).map(({ p }) => p);
    if (state.sort === 'price-asc') list = [...list].sort((a, b) => a.price - b.price);
    if (state.sort === 'price-desc') list = [...list].sort((a, b) => b.price - a.price);
    if (state.sort === 'newest') list = [...list].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    return list;
  }
  function renderHeading() {
    const cat = catalog.categoryById.get(state.category);
    title.textContent = cat ? cat.name : 'جميع الكتب';
    text.textContent = cat?.description || defaultText;
    setMeta({ title: cat ? `كتب ${cat.name}` : 'جميع الكتب' });
    crumbs.replaceChildren(...[
      el('li', {}, el('a', { href: pageUrl('index.html'), text: 'الرئيسية' })),
      cat ? el('li', {}, el('a', { href: pageUrl('books.html'), text: 'جميع الكتب' })) : null,
      el('li', {}, el('span', { 'aria-current': 'page', text: cat ? cat.name : 'جميع الكتب' })),
    ].filter(Boolean));
  }
  function update() {
    syncControls();
    writeParams();
    renderHeading();
    const list = filtered();
    clearBtn.hidden = !Object.entries(state).some(([k, v]) => k !== 'sort' && v);
    count.textContent = list.length ? booksLabel(list.length) : '';
    if (!list.length) {
      grid.replaceChildren(stateBox({
        iconName: 'search',
        title: 'لا توجد كتب تطابق اختيارك',
        text: state.q ? `جرّب كلمة بحث أخرى بدل «${state.q}»، أو امسح الفلاتر لعرض كل الكتب.` : 'امسح الفلاتر لعرض كل الكتب.',
        action: el('button', { type: 'button', class: 'btn btn--outline', onclick: () => clearBtn.click() }, 'مسح الفلاتر'),
      }));
      return;
    }
    grid.replaceChildren(...list.map((p) => bookCard(p, catalog, { onAdd: (prod) => addToCart(catalog, prod, 1) })));
  }

  grid.replaceChildren(...skeletonCards(8));
  getCatalog().then((data) => {
    catalog = data;
    reconcile(catalog);
    index = catalog.products.map((p) => ({ p, hay: normalizeArabic([p.name, catalog.categoryById.get(p.category)?.name].join(' ')) }));
    const chip = (value, label) => el('button', { type: 'button', class: 'chip', dataset: { value }, 'aria-pressed': 'false', text: label });
    chips.replaceChildren(chip('', 'الكل'), ...catalog.categories.map((c) => chip(c.id, c.name)));
    chips.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      state.category = btn.dataset.value;
      update();
    });
    if (catalog.levels.length) {
      levelSel.append(...catalog.levels.map((l) => el('option', { value: l.id, text: l.name })));
      $('#level-field').hidden = false;
    }
    if (catalog.ageGroups.length) {
      ageSel.append(...catalog.ageGroups.map((a) => el('option', { value: a.id, text: a.name })));
      $('#age-field').hidden = false;
    }
    if (!catalog.hasDates) $('#sort-newest').remove();
    q.addEventListener('input', debounce(() => { state.q = q.value.trim(); update(); }, 180));
    levelSel.addEventListener('change', () => { state.level = levelSel.value; update(); });
    ageSel.addEventListener('change', () => { state.age = ageSel.value; update(); });
    sortSel.addEventListener('change', () => { state.sort = sortSel.value; update(); });
    form.addEventListener('submit', (e) => { e.preventDefault(); q.blur(); });
    clearBtn.addEventListener('click', () => { Object.keys(state).forEach((k) => { state[k] = ''; }); update(); q.focus(); });

    readParams(route.params);
    grid.removeAttribute('aria-busy');
    update();
    const active = $('.chip[aria-pressed="true"]', chips);
    if (active && chips.scrollWidth > chips.clientWidth) {
      chips.scrollLeft += active.getBoundingClientRect().left - chips.getBoundingClientRect().left - 16;
    }
  }).catch((err) => {
    console.error(err);
    grid.removeAttribute('aria-busy');
    count.textContent = '';
    grid.replaceChildren(errorState(() => location.reload()));
  });
};

/* ============================ تفاصيل الكتاب ============================ */
PAGES.product = (route) => {
  const root = $('#product-root');
  const crumbs = $('#crumbs');

  function gallery(product) {
    const images = [coverSrc(product), ...product.gallery.map(asset)].filter(Boolean);
    const main = coverEl(product, { eager: true, size: 'lg' });
    const wrap = el('div', { class: 'product__gallery' }, main);
    if (images.length < 2) return wrap;
    const mainImg = $('img', main);
    const thumbs = images.map((src, i) => el('button', {
      type: 'button', class: 'thumb', 'aria-pressed': i === 0 ? 'true' : 'false',
      'aria-label': i === 0 ? 'عرض الغلاف' : `عرض الصورة ${formatNumber(i + 1)}`,
      onclick: (e) => {
        if (!mainImg) return;
        mainImg.src = src;
        mainImg.alt = i === 0 ? `غلاف كتاب ${product.name}` : `صورة ${formatNumber(i + 1)} من كتاب ${product.name}`;
        thumbs.forEach((t) => t.setAttribute('aria-pressed', String(t === e.currentTarget)));
      },
    }, el('img', { src, alt: '', loading: 'lazy', width: 120, height: 150 })));
    wrap.append(el('div', { class: 'product__thumbs', role: 'group', 'aria-label': 'صور الكتاب' }, thumbs));
    return wrap;
  }

  function specs(product, category) {
    const rows = [
      ['القسم', category?.name],
      ['المرحلة', product.level.length ? product.level.map(levelName).join('، ') : null],
      ['السن', product.ageGroup ? ageName(product.ageGroup) : null],
      ['عدد الصفحات', product.pageCount ? `${formatNumber(product.pageCount)} صفحة` : null],
      ['الحالة', product.available ? 'متاح للطلب' : 'غير متاح حاليًا'],
    ].filter(([, v]) => v);
    return el('dl', { class: 'specs' }, rows.map(([k, v]) => el('div', { class: 'specs__row' }, el('dt', { text: k }), el('dd', {}, el('bdi', { text: v })))));
  }

  function render(catalog, product) {
    const category = catalog.categoryById.get(product.category);
    setMeta({ title: product.name, description: product.description ? product.description.slice(0, 155) : `${product.name} من ${SITE.name}.` });
    if (category) crumbs.append(el('li', {}, el('a', { href: pageUrl('books.html', { category: category.id }), text: category.name })));
    crumbs.append(el('li', {}, el('span', { 'aria-current': 'page', text: product.name })));

    let buy;
    if (product.available) {
      const qty = qtyStepper({ value: 1, max: SITE.maxQty, label: `كمية «${product.name}»` });
      buy = el('div', { class: 'product__buy' }, qty,
        el('button', { type: 'button', class: 'btn btn--primary btn--lg product__add', onclick: () => addToCart(catalog, product, qty.getValue()) },
          icon('shopping-bag'), 'أضف إلى السلة'));
    } else {
      buy = el('div', { class: 'form-alert' }, icon('info'),
        el('p', {}, el('strong', { text: 'هذا الكتاب غير متاح حاليًا. ' }), 'يمكنك التواصل معنا للسؤال عن موعد توفره.'));
    }
    const hint = el('aside', { class: 'nursery-hint' },
      el('span', { class: 'nursery-hint__icon' }, icon('school')),
      el('div', {},
        el('p', { class: 'nursery-hint__title', text: 'تشتري لحضانة أو مركز تعليمي؟' }),
        el('p', { class: 'nursery-hint__text', text: 'أضف هذا الكتاب إلى طلب الحضانة بالكمية التي تحتاجها، واستلم عرض السعر على واتساب.' }),
        el('a', { class: 'nursery-hint__link', href: pageUrl('wholesale.html', { book: product.id }), text: 'أضفه لطلب الحضانة' })));
    const info = el('div', { class: 'product__info' }, ...[
      category ? el('a', { class: 'product__cat', href: pageUrl('books.html', { category: category.id }), text: category.name }) : null,
      el('h1', { class: 'product__title', text: product.name }),
      el('div', { class: 'product__price' }, priceEl(product.price, 'price price--lg'),
        product.originalPrice ? el('del', { class: 'price--old' }, el('bdi', {}, formatPrice(product.originalPrice))) : null),
      product.isDemo ? el('p', { class: 'demo-line' }, icon('info', 'icon--sm'), 'بيانات هذا الكتاب تجريبية وستُستبدل بالبيانات الحقيقية.') : null,
      buy,
      product.description ? el('div', { class: 'product__about' }, el('h2', { text: 'عن الكتاب' }), el('p', { text: product.description })) : null,
      specs(product, category),
      hint,
    ].filter(Boolean));
    root.removeAttribute('aria-busy');
    root.replaceChildren(el('article', { class: 'product' }, gallery(product), info));
    track('ViewContent', { content_ids: [product.id], content_type: 'product', value: product.price });

    const related = catalog.products.filter((p) => p.category === product.category && p.id !== product.id).slice(0, 4);
    if (related.length) {
      $('#related-grid').replaceChildren(...related.map((p) => bookCard(p, catalog, { onAdd: (prod) => addToCart(catalog, prod, 1) })));
      $('#related-link').href = pageUrl('books.html', { category: product.category });
      $('#related').hidden = false;
    }
  }

  getCatalog().then((catalog) => {
    reconcile(catalog);
    const product = catalog.productById.get(route.id || route.params.get('id') || '');
    if (product) { render(catalog, product); return; }
    setMeta({ title: 'الكتاب غير موجود' });
    crumbs.append(el('li', {}, el('span', { 'aria-current': 'page', text: 'كتاب غير موجود' })));
    root.removeAttribute('aria-busy');
    root.replaceChildren(stateBox({
      iconName: 'book-open',
      title: 'هذا الكتاب غير موجود',
      text: 'ربما تغيّر الرابط أو لم يعد الكتاب ضمن الكتالوج. تصفّح الكتب المتاحة الآن.',
      action: el('a', { class: 'btn btn--primary', href: pageUrl('books.html') }, 'تصفّح جميع الكتب'),
    }));
  }).catch((err) => {
    console.error(err);
    root.removeAttribute('aria-busy');
    root.replaceChildren(errorState(() => location.reload()));
  });
};

/* ============================ السلة ============================ */
PAGES.cart = (route, signal) => {
  const root = $('#cart-root');
  const title = $('#cart-title');
  let catalog = null;
  let refs = null;

  function renderEmpty(message) {
    root.replaceChildren(...[
      message ? el('div', { class: 'form-alert cart-alert', role: 'status' }, icon('check'), el('p', { text: message })) : null,
      stateBox({
        iconName: 'shopping-bag', title: 'سلتك فارغة', text: 'تصفّح الكتب وأضف ما تحتاجه، وسيظهر هنا.',
        action: el('a', { class: 'btn btn--primary', href: pageUrl('books.html') }, 'تصفّح الكتب'),
      }),
    ].filter(Boolean));
  }
  function updateSummary() {
    const { count, total, lines } = getLines(catalog);
    if (!lines.length) { renderEmpty(); return; }
    refs.count.textContent = copiesLabel(count);
    refs.total.textContent = formatPrice(total);
  }
  function itemRow(line) {
    const p = line.product;
    const category = catalog.categoryById.get(p.category);
    const href = pageUrl('product.html', { id: p.id });
    const totalEl = el('bdi', { class: 'price', text: formatPrice(line.total) });
    const qty = qtyStepper({
      value: line.qty, max: SITE.maxQty, label: `كمية «${p.name}»`,
      onChange: (n) => { setQty(p.id, n); totalEl.textContent = formatPrice(p.price * n); updateSummary(); },
    });
    qty.classList.add('qty--sm');
    const row = el('li', { class: 'cart-item' },
      el('a', { class: 'cart-item__media', href, tabindex: '-1', 'aria-hidden': 'true' }, coverEl(p, { size: 'thumb' })),
      el('div', { class: 'cart-item__info' },
        category ? el('p', { class: 'cart-item__cat', text: category.name }) : null,
        el('h3', { class: 'cart-item__title' }, el('a', { href, text: p.name })),
        el('p', { class: 'cart-item__unit' }, 'سعر النسخة: ', priceEl(p.price, 'cart-item__unit-price'))),
      el('div', { class: 'cart-item__controls' }, qty,
        el('div', { class: 'cart-item__total' }, el('span', { class: 'visually-hidden', text: 'الإجمالي: ' }), totalEl)),
      el('button', {
        type: 'button', class: 'icon-btn cart-item__remove', 'aria-label': `احذف «${p.name}» من السلة`,
        onclick: () => {
          const next = row.nextElementSibling || row.previousElementSibling;
          removeItem(p.id);
          row.remove();
          toast(`حُذف «${p.name}» من السلة.`);
          updateSummary();
          (next?.querySelector('.cart-item__remove') || title).focus();
        },
      }, icon('trash-2')));
    return row;
  }
  function summary() {
    const { count, total } = getLines(catalog);
    const countEl = el('span', { text: copiesLabel(count) });
    const totalEl = el('bdi', { class: 'price price--lg', text: formatPrice(total) });
    refs = { count: countEl, total: totalEl };
    const nameInput = el('input', { class: 'input', id: 'c-name', type: 'text', autocomplete: 'name', maxlength: '60', placeholder: 'مثال: أم يوسف' });
    const govSelect = el('select', { class: 'select', id: 'c-gov', autocomplete: 'address-level1' },
      el('option', { value: '', text: 'اختر المحافظة' }), GOVERNORATES.map((g) => el('option', { value: g, text: g })));
    const ready = isWhatsAppReady();
    const sendBtn = el('button', { type: 'button', class: 'btn btn--primary btn--lg btn--block' }, icon('whatsapp'), 'إرسال الطلب عبر واتساب');
    const result = el('div', { role: 'status' });
    sendBtn.addEventListener('click', () => {
      const data = getLines(catalog);
      if (!data.lines.length) return;
      const text = buildOrderMessage(data, { name: nameInput.value.trim(), governorate: govSelect.value }, orderRef('JS'));
      const opened = sendToWhatsApp(text, result, {
        afterActions: [
          el('button', { type: 'button', class: 'btn btn--outline btn--sm', onclick: () => { clearCart(); renderEmpty('تم إفراغ السلة. شكرًا لطلبك.'); title.focus(); } }, 'أرسلت الطلب، أفرغ السلة'),
          el('button', { type: 'button', class: 'btn btn--ghost btn--sm', onclick: () => result.replaceChildren() }, 'لم أرسله بعد'),
        ],
      });
      if (opened) track('InitiateCheckout', { value: data.total, num_items: data.count, content_ids: data.lines.map((l) => l.product.id) });
    });
    return el('aside', { class: 'cart-summary', 'aria-labelledby': 'summary-title' }, ...[
      el('h2', { class: 'cart-summary__title', id: 'summary-title', text: 'ملخص الطلب' }),
      el('dl', { class: 'cart-summary__rows' },
        el('div', {}, el('dt', { text: 'عدد النسخ' }), el('dd', {}, countEl)),
        el('div', { class: 'cart-summary__total' }, el('dt', { text: 'إجمالي سعر الكتب' }), el('dd', {}, totalEl))),
      el('p', { class: 'hint', text: 'الإجمالي المعروض هو مجموع أسعار الكتب فقط.' }),
      el('div', { class: 'cart-summary__fields' },
        el('p', { class: 'cart-summary__fields-title', text: 'بيانات تُضاف إلى رسالة الطلب (اختيارية)' }),
        el('div', { class: 'field' }, el('label', { class: 'label', for: 'c-name', text: 'الاسم' }), nameInput),
        el('div', { class: 'field' }, el('label', { class: 'label', for: 'c-gov', text: 'المحافظة' }), govSelect)),
      sendBtn,
      ready ? null : el('p', { class: 'hint', text: 'نسخة معاينة: يُضاف رقم واتساب الرسمي من الإعدادات قبل الإطلاق.' }),
      result,
      el('p', { class: 'cart-summary__note' }, icon('info', 'icon--sm'), isPersistent()
        ? 'السلة محفوظة على هذا الجهاز وهذا المتصفح فقط، ولا تصلنا إلا بعد إرسالها عبر واتساب.'
        : 'المتصفح يمنع حفظ السلة، لذلك ستُفقد عند إغلاق الصفحة. أرسل طلبك قبل المغادرة.'),
    ].filter(Boolean));
  }
  function renderAll(removedNames = []) {
    const { lines } = getLines(catalog);
    root.removeAttribute('aria-busy');
    const named = removedNames.filter(Boolean);
    const removedMsg = removedNames.length
      ? el('div', { class: 'form-alert cart-alert', role: 'status' }, icon('info'),
        el('p', { text: named.length ? `حُذف من سلتك ما لم يعد متاحًا: ${named.join('، ')}.` : 'حُذفت من سلتك كتب لم تعد متاحة.' }))
      : null;
    if (!lines.length) { renderEmpty(); if (removedMsg) root.prepend(removedMsg); return; }
    root.replaceChildren(...[
      removedMsg,
      el('div', { class: 'cart' },
        el('div', { class: 'cart__main' },
          el('ul', { class: 'cart__list', 'aria-label': 'الكتب في السلة' }, lines.map(itemRow)),
          el('a', { class: 'btn btn--ghost cart__continue', href: pageUrl('books.html') }, 'متابعة التسوق')),
        summary()),
    ].filter(Boolean));
  }

  getCatalog().then((data) => {
    catalog = data;
    renderAll(reconcile(catalog));
    window.addEventListener('storage', (e) => { if (e.key === 'ajs-cart-v1' || e.key === null) renderAll(); }, { signal });
  }).catch((err) => {
    console.error(err);
    root.removeAttribute('aria-busy');
    root.replaceChildren(errorState(() => location.reload()));
  });
};

/* ============================ الحضانات والجملة ============================ */
PAGES.wholesale = (route) => {
  const form = $('#ws-form');
  const rows = $('#ws-rows');
  const addRowBtn = $('#add-row');
  const errorsBox = $('#form-errors');
  const result = $('#ws-result');
  const gov = $('#gov');
  const field = (name) => form.querySelector(`[name="${name}"]`);
  const WS_MAX = SITE.wholesaleMaxQty;
  let catalog = null;
  let rowSeq = 0;

  gov.append(...GOVERNORATES.map((g) => el('option', { value: g, text: g })));
  $('[data-scroll-to]')?.addEventListener('click', (e) => {
    const target = document.getElementById(e.currentTarget.dataset.scrollTo);
    target?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    setTimeout(() => field('org').focus({ preventScroll: true }), 400);
  });

  function bookSelect(id, selected) {
    const select = el('select', { class: 'select', id, name: 'book' }, el('option', { value: '', text: 'اختر الكتاب' }));
    catalog.categories.forEach((c) => {
      const items = catalog.products.filter((p) => p.category === c.id);
      if (!items.length) return;
      select.append(el('optgroup', { label: c.name }, items.map((p) =>
        el('option', { value: p.id, disabled: !p.available, selected: p.id === selected, text: p.available ? p.name : `${p.name} (غير متاح حاليًا)` }))));
    });
    return select;
  }
  function updateRemoveButtons() {
    const single = rows.children.length === 1;
    $$('.ws-row__remove', rows).forEach((b) => { b.hidden = single; });
  }
  function addRow(selected = '') {
    rowSeq += 1;
    const n = rowSeq;
    const select = bookSelect(`book-${n}`, selected);
    const qty = el('input', { class: 'input', id: `qty-${n}`, name: 'qty', type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: 'العدد', maxlength: String(String(WS_MAX).length) });
    qty.addEventListener('input', () => { qty.value = toLatinDigits(qty.value).replace(/\D/g, ''); setFieldError(qty, ''); });
    select.addEventListener('change', () => setFieldError(select, ''));
    const removeBtn = el('button', { type: 'button', class: 'icon-btn ws-row__remove', 'aria-label': 'احذف هذا الكتاب من الطلب' }, icon('trash-2'));
    const row = el('li', { class: 'ws-row' },
      el('div', { class: 'field ws-row__book' }, el('label', { class: 'label', for: select.id, text: 'الكتاب' }), select),
      el('div', { class: 'field ws-row__qty' }, el('label', { class: 'label', for: qty.id, text: 'عدد النسخ' }), qty),
      removeBtn);
    removeBtn.addEventListener('click', () => {
      const next = row.nextElementSibling || row.previousElementSibling;
      row.remove();
      if (!rows.children.length) addRow();
      (next?.querySelector('select') || $('select', rows)).focus();
      updateRemoveButtons();
    });
    rows.append(row);
    updateRemoveButtons();
    return row;
  }
  const normalizePhone = (v) => {
    let n = toLatinDigits(v).replace(/[\s\-().]/g, '');
    if (n.startsWith('+20')) n = `0${n.slice(3)}`;
    else if (n.startsWith('0020')) n = `0${n.slice(4)}`;
    else if (n.startsWith('20') && n.length === 12) n = `0${n.slice(2)}`;
    return n;
  };
  function validate() {
    const errors = [];
    const fail = (f, msg) => { setFieldError(f, msg); errors.push({ field: f, msg }); };
    $$('.field.is-invalid', form).forEach((f) => setFieldError(f.querySelector('input, select, textarea'), ''));
    const org = field('org').value.trim();
    const contact = field('contact').value.trim();
    const phone = normalizePhone(field('phone').value);
    if (org.length < 2) fail(field('org'), 'اكتب اسم الحضانة أو الجهة.');
    if (contact.length < 2) fail(field('contact'), 'اكتب اسم المسؤول عن الطلب.');
    if (!/^01[0125]\d{8}$/.test(phone)) fail(field('phone'), 'اكتب رقم موبايل مصري من 11 رقمًا يبدأ بـ 01.');
    if (!gov.value) fail(gov, 'اختر المحافظة.');
    const items = new Map();
    $$('.ws-row', rows).forEach((row) => {
      const select = $('select', row);
      const qtyInput = $('input', row);
      const qty = Number(qtyInput.value);
      if (!select.value && !qtyInput.value) return;
      if (!select.value) { fail(select, 'اختر الكتاب أو احذف هذا السطر.'); return; }
      const product = catalog.productById.get(select.value);
      if (!product || !product.available) { fail(select, 'هذا الكتاب غير متاح حاليًا.'); return; }
      if (!Number.isInteger(qty) || qty < 1) { fail(qtyInput, 'اكتب عدد النسخ.'); return; }
      if (qty > WS_MAX) { fail(qtyInput, `الحد الأقصى ${formatNumber(WS_MAX)} نسخة للكتاب في الطلب الواحد.`); return; }
      const prev = items.get(product.id);
      items.set(product.id, { product, qty: Math.min(WS_MAX, (prev?.qty || 0) + qty) });
    });
    const other = field('other').value.trim();
    if (!items.size && !other && !errors.some((e) => e.field.closest('.ws-row'))) {
      fail($('select', rows) || field('other'), 'أضف كتابًا واحدًا على الأقل، أو اكتب الكتب المطلوبة في خانة «كتب أخرى».');
    }
    return {
      errors,
      data: {
        org, contact, phone,
        area: [gov.value, field('area').value.trim()].filter(Boolean).join(' — '),
        items: [...items.values()],
        other,
        notes: field('notes').value.trim(),
      },
    };
  }
  function showErrors(errors) {
    errorsBox.replaceChildren(icon('circle-alert'), el('div', {},
      el('p', {}, el('strong', { text: errors.length === 1 ? 'راجع الحقل التالي قبل الإرسال:' : 'راجع الحقول التالية قبل الإرسال:' })),
      el('ul', { class: 'error-list' }, errors.map(({ field: f, msg }) =>
        el('li', {}, el('a', { href: pageUrl('wholesale.html'), onclick: (e) => { e.preventDefault(); f.focus(); }, text: msg }))))));
    errorsBox.hidden = false;
    errorsBox.focus();
  }

  form.addEventListener('input', (e) => { if (e.target.matches('#org, #contact, #phone')) setFieldError(e.target, ''); });
  gov.addEventListener('change', () => setFieldError(gov, ''));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!catalog) return;
    result.replaceChildren();
    const { errors, data } = validate();
    if (errors.length) { showErrors(errors); return; }
    errorsBox.hidden = true;
    const ref = orderRef('WS');
    const text = buildWholesaleMessage(data, ref);
    if (SITE.formEndpoint) {
      fetch(SITE.formEndpoint, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ref, ...data, items: data.items.map((i) => ({ id: i.product.id, name: i.product.name, qty: i.qty })) }),
      }).catch(() => {});
    }
    const opened = sendToWhatsApp(text, result);
    if (opened) track('Lead', { content_category: 'wholesale', num_items: data.items.reduce((s, i) => s + i.qty, 0) });
    result.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
  });
  addRowBtn.addEventListener('click', () => $('select', addRow()).focus());

  getCatalog().then((data) => {
    catalog = data;
    const pre = route.params.get('book');
    addRow(catalog.productById.get(pre)?.available ? pre : '');
    $('#ws-cats').replaceChildren(...catalog.categories.map(catCard));
  }).catch((err) => {
    console.error(err);
    rows.replaceChildren(el('li', { class: 'form-alert form-alert--error' }, icon('circle-alert'),
      el('p', { text: 'تعذّر تحميل قائمة الكتب. اكتب الكتب المطلوبة في خانة «كتب أخرى»، أو أعد تحميل الصفحة.' })));
    catalog = { categories: [], products: [], productById: new Map() };
    addRowBtn.hidden = true;
  });
};

/* ============================ من نحن ============================ */
PAGES.about = () => {
  $('#about-body').replaceChildren(...SITE.about.full.map((t) => el('p', { text: t })));
  getCatalog().then((catalog) => $('#about-cats').replaceChildren(...catalog.categories.map(catCard)))

/* ============================ تواصل معنا ============================ */
PAGES.contact = () => {
  const list = $('#contact-list');
  const item = (iconName, label, value, href) => el('li', { class: 'contact-item' },
    el('span', { class: 'contact-item__icon' }, icon(iconName)),
    el('div', {}, el('p', { class: 'contact-item__label', text: label }),
      href ? el('a', { href, target: href.startsWith('http') ? '_blank' : null, rel: href.startsWith('http') ? 'noopener' : null }, el('bdi', { text: value })) : el('p', { text: value })));
  const items = [];
  if (isWhatsAppReady()) items.push(item('whatsapp', 'واتساب', 'ابدأ محادثة', waLink(`مرحبًا ${SITE.name}،`)));
  if (SITE.contact.phone) items.push(item('phone', 'الهاتف', SITE.contact.phone, `tel:${SITE.contact.phone.replace(/\s/g, '')}`));
  if (SITE.contact.email) items.push(item('mail', 'البريد الإلكتروني', SITE.contact.email, `mailto:${SITE.contact.email}`));
  if (SITE.contact.address) items.push(item('map-pin', 'العنوان', SITE.contact.address));
  const socialNames = { facebook: 'فيسبوك', instagram: 'إنستجرام', tiktok: 'تيك توك', youtube: 'يوتيوب' };
  Object.entries(SITE.social).filter(([, u]) => u).forEach(([k, u]) => items.push(item(k, socialNames[k] || k, 'زيارة الصفحة', u)));
  list.replaceChildren(...(items.length ? items : [el('li', { class: 'hint', text: 'تُضاف بيانات التواصل الرسمية من الإعدادات قبل الإطلاق.' })]));

  const form = $('#contact-form');
  const message = $('#cf-message');
  const result = $('#cf-result');
  message.addEventListener('input', () => setFieldError(message, ''));
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = message.value.trim();
    if (text.length < 3) { setFieldError(message, 'اكتب رسالتك قبل الإرسال.'); message.focus(); return; }
    const opened = sendToWhatsApp(buildContactMessage({ name: $('#cf-name').value.trim(), message: text }), result);
    if (opened) track('Contact');
  });
};

  }));

/* =====================================================================
   التنقل بين الصفحات (Router) — الروابط بالشكل #/books و #/product/<id>
   ===================================================================== */
const ROUTES = {
  '': { page: 'home', nav: 'home' },
  books: { page: 'books', nav: 'books' },
  product: { page: 'product', nav: 'books' },
  cart: { page: 'cart', nav: 'cart' },
  wholesale: { page: 'wholesale', nav: 'wholesale' },
  about: { page: 'about', nav: 'about' },
  contact: { page: 'contact', nav: 'contact' },
  policies: { page: 'policies', nav: 'policies' },
};
let routeController = null;
let firstRoute = true;

function parseRoute() {
  const h = location.hash;
  if (h && h !== '#' && !h.startsWith('#/')) return null; // رابط داخلي لقسم في نفس الصفحة
  const [path, qs = ''] = h.replace(/^#\/?/, '').split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || '', id: parts[1] ? decodeURIComponent(parts[1]) : '', params: new URLSearchParams(qs) };
}

function renderRoute() {
  const route = parseRoute();
  if (!route) return;
  const def = ROUTES[route.name] || { page: 'notfound', nav: '' };
  const tpl = document.getElementById(`tpl-${def.page}`);
  const main = document.getElementById('main');
  routeController?.abort();
  routeController = new AbortController();
  main.replaceChildren(tpl.content.cloneNode(true));
  main.classList.toggle('main--flush', tpl.dataset.flush === 'true');
  document.title = tpl.dataset.title ? `${tpl.dataset.title} | ${SITE.name}` : `${SITE.name} | كتب تعليمية وتأسيسية لأطفال الحضانة`;
  document.querySelector('meta[name="description"]')?.setAttribute('content', tpl.dataset.description || DEFAULT_DESCRIPTION);
  onRouteChange(def.nav);
  window.scrollTo(0, 0);
  PAGES[def.page](route, routeController.signal);
  if (!firstRoute) {
    main.focus({ preventScroll: true });
    track('PageView');
  }
  firstRoute = false;
}

const DEFAULT_DESCRIPTION = document.querySelector('meta[name="description"]')?.getAttribute('content') || '';

/* ---------- التشغيل ---------- */
initLayout('home');
window.addEventListener('hashchange', renderRoute);
renderRoute();
})();
